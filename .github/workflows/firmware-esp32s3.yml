name: Firmware ESP32-S3

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-esp32s3.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-esp32s3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.0

      - name: Install ESP32 core and BNO085 library
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "SparkFun BNO08x Cortex Based IMU@1.0.6"

      - name: Compile FlexCam with production board options
        run: |
          arduino-cli compile \
            --warnings all \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CPUFreq=240,USBMode=hwcdc,CDCOnBoot=cdc" \
            --output-dir build/esp32s3_flexcam \
            firmware/esp32s3_flexcam

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-flexcam-firmware
          path: build/esp32s3_flexcam/
          if-no-files-found: error
